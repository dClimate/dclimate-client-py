# pyproject.toml

[build-system]
requires = ["pdm-backend==2.4.3"]
build-backend = "pdm.backend"

[project]
name = "dclimate-client-py"
version = "0.6.0" # Set a static version or handle it in versioning strategy
description = "Python client library for accessing dClimate weather and climate data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "Phil Van Meppelen Scheppink", email = "phil@dclimate.net" },
    { name = "Evan Schechter", email = "evan@arbol.io" },
    { name = "Chris Rossi", email = "chris@christophermrossi.com" },
    { name = "Robert Banick", email = "robert.banick@arbol.io" },
]
requires-python = ">=3.12"
keywords = ["climate", "weather", "data", "dclimate", "meteorology", "climate-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiobotocore>=2.13.0",
    "aiohttp>=3.9.0",
    "xarray>=2025.3.0",
    "rioxarray>=0.15.0",
    "zarr>=3.0.8",
    "numpy>=2.1.3",
    "py_hamt>=3.4.1",
    "multiformats>=0.3.1",
    "geopandas>=1.0.0",
    "pandas>=2.2.0",
    "s3fs>=2024.6.0",
    "shapely>=2.0.0",
    # xarray's in-memory to_netcdf() (GeotemporalData.to_netcdf with no args)
    # requires the scipy netCDF backend
    "scipy>=1.12.0",
    "pycryptodome>=3.21.0",
    "pystac>=1.10.0",
    "httpx>=0.27.0",
    "x402[evm,httpx]>=2.1.0",
    "opentelemetry-api>=1.30.0",
]

[project.urls]
Homepage = "https://dclimate.net/"

[project.optional-dependencies]
testing = [
    "mypy>=1.14",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio>=1.3.0",
]
dev = ["pre-commit>=4.1.0", "ruff>=0.9.5"]
examples = ["python-dotenv>=1.0.0"]

[tool.uv.sources]
# Track py-hamt PR #88 (review-fixes-integration): HTTP/2 + perf/bug fixes.
# Drop this pin once PR #88 is merged and released.
py_hamt = { git = "https://github.com/dClimate/py-hamt", branch = "review-fixes-integration" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ipfs: marks tests requiring a running IPFS daemon and network access",
    "integration: marks integration tests (often slower, may require external services like IPFS)",
    # Add other custom marks here if you create more
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
