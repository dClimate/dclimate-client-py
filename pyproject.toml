# pyproject.toml

[build-system]
requires = ["pdm-backend==2.4.3"]
build-backend = "pdm.backend"

[project]
name = "dclimate-client-py"
version = "0.5.9" # Set a static version or handle it in versioning strategy
description = "Python client library for accessing dClimate weather and climate data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    { name = "Phil Van Meppelen Scheppink", email = "phil@dclimate.net" },
    { name = "Evan Schechter", email = "evan@arbol.io" },
    { name = "Chris Rossi", email = "chris@christophermrossi.com" },
    { name = "Robert Banick", email = "robert.banick@arbol.io" },
]
requires-python = ">=3.12"
keywords = ["climate", "weather", "data", "dclimate", "meteorology", "climate-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "aiobotocore",
    "xarray>=2025.3.0",
    "rioxarray",
    "zarr>=3.0.8",
    "numpy>=2.1.3",
    "py_hamt>=3.3.1",
    "requests",
    "pyarrow",
    "geopandas",
    "pandas",
    "s3fs",
    "shapely",
    "scipy",
    "pycryptodome>=3.21.0",
    "pystac>=1.10.0",
    "httpx>=0.27.0",
    "x402[evm,httpx]>=2.1.0",
    "python-dotenv>=1.0.0",
    "opentelemetry-api>=1.30.0",
]

[project.urls]
Homepage = "https://dclimate.net/"

[project.optional-dependencies]
testing = ["pytest", "pytest-cov", "pytest-mock", "pytest-asyncio>=1.3.0"]
dev = ["pre-commit>=4.1.0", "ruff>=0.9.5"]

[tool.pytest.ini_options]
markers = [
    "ipfs: marks tests requiring a running IPFS daemon and network access",
    "integration: marks integration tests (often slower, may require external services like IPFS)",
    # Add other custom marks here if you create more
]
